fig_main:
  generator: scripts/make_figures.py
  discovery: data/ladders.yaml (via make_repin_figures.campaign_rows; )
  guard: tests/test_figure_burned_values.py
  pins: composition_sumrule60k
  figures:
    fig2_regime_map:
      file: figures/fig2_regime_map.pdf
      shows: '(a) cell-D gamma_ratio vs L at ALL NINE rungs, PN 1d (C0 filled circles, solid) + PN 2d
        (C3 open squares, dashed), y zoomed to [0.985, 1.015] so the worst 0.58% rung (sum-rule pin, L=0.1
        1d) is clearly resolved; thin black unity line; the +-0.3% floor band (legend: ''DOM floor'')
        in figB''s convention. NO +-10% band -- that band now appears only in fig_reduced_formulations,
        where it is the claim being tested. (b) shape RMSE of A(t)/A_0 vs DOM, same nine rungs, both geometries,
        log y on [1e-4, 2e-2]. data_check refuses a clipped rung, so the zoomed limits cannot silently
        delete a future re-pin''s worst point.'
      status: publication
    fig3_traces:
      file: figures/fig3_traces.pdf
      shows: Signed A(t)/A0 at five decade periods in a two-plus-three panel layout. Ballistic panel includes
        a late-window inset scaled by1000. Original PN1D/PN2D/reference arrays unchanged; shared reference
        line uses the existing geometry-separation check. Duplicate rate annotations removed; PDF Subject
        carries the plotted trace-array SHA256, checked independently against active and retired pins
        by the content test.
      status: publication
    fig_reduced_formulations:
      file: figures/fig_reduced_formulations.pdf
      shows: Rate and shape summaries plus CEballistic, plain10umfreeze and Duhamel100umfast-decay traces.
        Same current pins; pure20kvsproduction60k.
      status: publication
    fig_reduced_traces_appendix:
      file: figures/fig_reduced_traces_appendix.pdf
      shows: Every original seven-panel reduced-comparison data line, including historical MLP metric
        references with distinct finite-amplitude physics disclosed. AppendixE.1; no evidence removed.
      status: publication
      tex: main.tex app:controls, fig:reduced-full
fig_repin:
  generator: scripts/make_repin_figures.py
  discovery: data/ladders.yaml (ladder_source; )
  pins: composition_sumrule60k
  figures:
    figB_repin_banded_rates:
      file: figures/figB_repin_banded_rates.pdf
      shows: 'barrier-2 axes: early/mid/late banded local rates, 1d-vs-2d panels; late points NOT band-robust
        drawn HOLLOW -- quote the terminal axis, never the late rate, for those'
      status: publication
fig_mode_spectrum:
  generator: scripts/make_mode_spectrum_figure.py
  artefact: scripts/p101_mode_spectrum.py
  artefact_generator: scripts/p101_mode_spectrum.py
  convention: 'K0, K1 reduced at y = gamma_hat tau_m = 0 (the slow-collective form K0 = arctan(xi)/xi,
    in which Eq. (ugks-limits)''s two exact limits are stated). DECLARED, not silent, AND QUOTED AT ALL
    THREE DRAWN PERIODS rather than at the mildest one. With gamma_hat taken as the DOM reference''s own
    effective rate ON THE SAME JOINT COMB the heat-capacity-weighted mean of K0 moves 0.582 -> 0.564 at
    L=0.1um, 0.864 -> 0.920 at 1um and 0.993 -> 0.996 at 10um; over the nine sweep periods it is non-monotone
    (falls from L=0.1 to 0.3) and at L=0.01um it leaves [0,1] and turns negative (-0.2295). (Legacy-comb
    history: the sign flip sat at the DRAWN L=0.1um rung, 0.247 -> -0.048.) So the monotonicity and the
    [0,1] bounding drawn in panel (b) are properties of the y=0 form, not of Eq. (ugks-c). Bound as `pn.modespec.slaved.share.ydep`.
    The y-dependent form is not drawn because at L=0.01um no single collective rate exists (`dominant_gamma`
    returns ok=False on the joint comb) and because K0(y,xi) is a resolvent that passes through 1 and
    changes sign as y crosses 1, not a share. Neither form has a threshold.'
  figures:
    fig_mode_spectrum:
      file: figures/fig_mode_spectrum.pdf
      status: publication
