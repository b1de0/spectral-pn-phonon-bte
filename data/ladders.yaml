# =====================================================================
#
# Read by ALL THREE consumers, so they cannot disagree:
#   scripts/make_figures.py -- LADDER_SOURCE
#   scripts/p086_cell_d_ledger.py -- the artefact G1 checks against
#
# alone.  Flipping it there would have shipped a page whose Figure 11(c) shows
# L = 1 um with NO zero crossing (joint: 0/1200 samples) while its own caption
# and sec:metrics both print 20.9 % of the window (legacy).  Three consumers,
# three chances to forget one; one file, none.
#
# phonon_modes(20, 300) returns the MEASURE-ONLY ACOUSTIC comb -- 60 modes,
# kappa = 143.03 -- which is NEITHER of the two below.  Never rely on the
#
# DIMENSIONAL AXIS, the reason `joint` is the target:
#   legacy  kappa = 72.98  W/(m K)  -- FAILS against measured bulk Si 142-156
#   joint   kappa = 144.264         -- passes
# corridor60k RIDES THE JOINT COMB (--mode-source joint): same kappa, same
#
# checked to resolve to a directory at write time.  Do not hand-edit a rung.
# =====================================================================
ladder_source: sumrule60k

# Which MODE COMB each named ladder was trained on.  Consumers that dispatch
# comb-dependent behaviour (arbiter context manager, npz mode_source guard,
# which ablation directory layout) MUST key on THIS map, never on the ladder's
# name: `LADDER_SOURCE == "joint"` silently misroutes every later ladder that
# also rides the joint comb, which is exactly what corridor60k is.
combs:
  legacy: legacy
  joint: joint
  corridor60k: joint
  # that closes the 3-modes-per-cell sum rule (ttg_dispersion.sum_rule_grid(20):
  # midpoint rule, radius K_NORM_HI_SUM_RULE, first node anchored at the
  # production floor).  Dimensional axis: kappa = 142.30 W/(m K) (in band),
  # mode count 0.9989 of exact, C = 1.0028 rho c_p, D = 0.989 alpha_meas.
  sumrule60k: joint-sumrule

# Uniformity CONTRACT of a named ladder: what EVERY arm must satisfy, declared
# once and verified field-by-field by consumers that re-read the arms (the
# absolute-artefact writer refuses an arm that differs --
# uniform_params_within_experiment_type).  `legacy` deliberately has no entry:
# it predates the contract, carries one disclosed seed deviation (2D L=1.5 =
# seed 1), and is never routed through the absolute writer.
ladder_meta:
  joint: {epochs: 20000, seed: 42, snapshot: min-loss, gauge: additive}
  corridor60k: {epochs: 60000, seed: 42, snapshot: final, gauge: corridor}
  sumrule60k: {epochs: 60000, seed: 42, snapshot: final, gauge: corridor}
