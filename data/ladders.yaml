      C2 L=0.01 plain: data/runs/pn_sumrule_adoption/C2_L0.01_plain
      C7 L=10 ce: data/runs/pn_sumrule_adoption/C7_L10_ce
      C7 L=100 ce: data/runs/pn_sumrule_adoption/C7_L100_ce
      C9 L=0.1 ce 20k: data/runs/pn_sumrule_adoption/C9_L0.1_ce
