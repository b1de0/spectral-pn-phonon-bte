# ABLATION ARMS, keyed BY THE LABEL the claim store looks rows up by.
# Renaming a key here silently EMPTIES a claim rather than moving it.
# The joint set is the twelve arms of p118_joint_repin_queue.sh, run to
# replace the twelve legacy entries one for one.
ablations:
  legacy:
    main:
      C3 L=1 plain s42: data/runs/spectral_pn_1.0um/20260707_164346
      C3 L=1 plain s0: data/runs/spectral_pn_1.0um/20260707_173627
      C3 L=1 plain s1: data/runs/spectral_pn_1.0um/20260707_182908
      C5 L=0.1 plain l16: data/runs/spectral_pn_0.1um/20260707_201435
      C6 L=0.1 duhamel: data/runs/spectral_pn_0.1um/20260709_010959
      C8 L=10 plain freeze: data/runs/spectral_pn_10.0um/20260707_192149
    cited:
      C1 L=0.01 duhamel: data/runs/spectral_pn_0.01um/20260708_231945
      C2 L=0.01 plain: data/runs/spectral_pn_0.01um/20260709_001714
      C7 L=10 ce: data/runs/spectral_pn_10.0um/20260709_030913
      C7 L=100 ce: data/runs/spectral_pn_100.0um/20260709_020952
      C9 L=0.1 ce 20k: data/runs/spectral_pn_0.1um/20260709_050612
      C10 L=1.0 ce: data/runs/spectral_pn_1.0um/20260709_040747
  joint: &joint_ablations
    main:
      C3 L=1 plain s42: data/runs/p118_joint_repin/abl_L1.0_plain_s42
      C3 L=1 plain s0: data/runs/p118_joint_repin/abl_L1.0_plain_s0
      C3 L=1 plain s1: data/runs/p118_joint_repin/abl_L1.0_plain_s1
      C5 L=0.1 plain l16: data/runs/p118_joint_repin/abl_L0.1_plain_lmax16
      C6 L=0.1 duhamel: data/runs/p118_joint_repin/abl_L0.1_duhamel
      C8 L=10 plain freeze: data/runs/p118_joint_repin/abl_L10.0_plain
    cited:
      C1 L=0.01 duhamel: data/runs/p118_joint_repin/abl_L0.01_duhamel
      C2 L=0.01 plain: data/runs/p118_joint_repin/abl_L0.01_plain
      C7 L=10 ce: data/runs/p118_joint_repin/abl_L10.0_ce
      C7 L=100 ce: data/runs/p118_joint_repin/abl_L100.0_ce
      C9 L=0.1 ce 20k: data/runs/p118_joint_repin/abl_L0.1_ce
      C10 L=1.0 ce: data/runs/p118_joint_repin/abl_L1.0_ce
      # battery never had -- CE at the ballistic pole, Duhamel at the three
      # slow-collective lengths.  Same command byte-for-byte (20k, joint,
      # seed 42, final snapshot); with them every pure formulation is
      # measured at every decade it is quoted at, and each fails the +-10%
      # rate band somewhere: the "no single pure structure spans the ladder"
      # universal is EARNED, not scoped.
      C43 L=0.01 ce: data/runs/p135_ablation_cells/abl_L0.01_ce
      C44 L=1.0 duhamel: data/runs/p135_ablation_cells/abl_L1.0_duhamel
      C44 L=10 duhamel: data/runs/p135_ablation_cells/abl_L10.0_duhamel
      C44 L=100 duhamel: data/runs/p135_ablation_cells/abl_L100.0_duhamel
  # A YAML ALIAS, NOT A COPY: under corridor60k the ablation battery IS the
  # arms; the reduced-formulation battery stays at 20k on the additive gauge,
  # and the manuscript must SAY so where it quotes the battery (a stated mixed
  # budget, not a silent one).  An alias cannot drift from its target.
  corridor60k: *joint_ablations
  # arms, 20k, additive gauge, seed 42 (C3: 42/0/1), plus the two C9 seeds
  sumrule60k:
    main:
      C3 L=1 plain s42: data/runs/pn_sumrule_adoption/C3_L1.0_plain_s42
